; Runs nginx and php-fpm side by side in one container.
;
; A container platform that gives you a single process slot per service (Render,
; Fly, App Runner, Cloud Run) has nowhere to put a second container for nginx,
; so the two are supervised here instead of wired together over a compose
; network.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; If PHP dies the container is useless — nginx would serve 502s while the
; platform's health check still saw a listening socket and called it healthy.
; Bringing supervisord down instead lets the platform restart and, on a crash
; loop, roll back.
exitcodes=0
stopsignal=QUIT

[program:nginx]
; Started after php-fpm (lower priority runs first). nginx resolves
; fastcgi_pass at request time, not at start, so a brief ordering gap is fine.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT

[eventlistener:quit_on_failure]
; Without this, supervisord happily keeps running with a dead child and the
; platform sees a "healthy" container that serves nothing.
events=PROCESS_STATE_FATAL
command=sh -c 'printf "READY\n"; while read -r _; do kill -QUIT 1; done'

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Must clear the app's 50MB intro-video cap. nginx enforces this before the
    # request ever reaches PHP, and its rejection is an HTML 413 — not the JSON
    # envelope the API promises — so it is set above the cap rather than at it.
    client_max_body_size 64m;

    # A 50MB upload over a slow phone connection takes a while; the 60s
    # defaults would drop it mid-transfer.
    client_body_timeout 120s;
    send_timeout 120s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # `app` is the compose service name; Docker's embedded DNS resolves it.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Long enough for a video upload to finish being written.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;

        # Signed file URLs and resume downloads can outgrow the 4k default and
        # would otherwise fail with "upstream sent too big header".
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
    }

    # php-fpm's health endpoint, for the compose healthcheck. Restricted to
    # private ranges so it is not reachable from outside the compose network.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    # Never serve the dotfiles that end up under the web root.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}

; Overrides the base image's pool config (loaded after it, alphabetically).
[www]
user = www-data
group = www-data

; TCP rather than a unix socket: nginx runs in a separate container, so there
; is no shared filesystem to put a socket on.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically so a slow leak in a long-lived process cannot
; accumulate across days of uptime.
pm.max_requests = 500

; Surface worker output in `docker logs` instead of swallowing it.
catch_workers_output = yes
decorate_workers_output = no

; php-fpm's own ping/status endpoint, used by the compose healthcheck.
pm.status_path = /fpm-status
ping.path = /fpm-ping

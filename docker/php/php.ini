; Loaded as conf.d/zz-app.ini so these win over the base image's defaults.

; ── uploads ─────────────────────────────────────────────────────────────────
; The intro-video endpoint accepts 50MB (config/options.php: 50 * 1024 KB).
; PHP rejects an oversized body before Laravel ever validates it, and the
; response is an empty 413 rather than the documented JSON error — so these
; sit above the app's own cap, not at it. nginx's client_max_body_size has to
; clear the same bar; both are enforced independently.
upload_max_filesize = 64M
post_max_size = 68M
max_file_uploads = 20

; Video uploads on a slow connection outlive the 30s default.
max_execution_time = 120
max_input_time = 120
memory_limit = 512M

; ── opcache ─────────────────────────────────────────────────────────────────
; validate_timestamps=0 because the code in an image never changes at runtime;
; a rebuild replaces the container. Leaving revalidation on would stat every
; file on every request for a change that cannot happen.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; ── errors ──────────────────────────────────────────────────────────────────
; To stderr so `docker logs` and the platform's log collector see them.
; display_errors stays off: Laravel renders its own error responses, and the
; API contract guarantees a JSON envelope that raw PHP output would break.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; Do not advertise the PHP version in response headers.
expose_php = Off
